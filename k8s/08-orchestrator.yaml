apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: project_frontback-orchestrator:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "orchestrator.api:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_URL
              value: "redis://redis:6379/0"
            - name: MYSQL_HOST
              value: "mysql"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: "llm_user"
            - name: MYSQL_DATABASE
              value: "llm_config"
          envFrom:
            - secretRef:
                name: moonpilot-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
spec:
  type: NodePort
  selector:
    app: orchestrator
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080