name: CD

on:
  push:
    branches: [main, dev-microservices]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- image commune (workers + orchestrateur + admin) ----------
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/moonpilot-backend:latest
            ghcr.io/${{ github.repository_owner }}/moonpilot-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- image du back-office ----------
      - name: Build and push admin-ui image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-ui
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/moonpilot-admin-ui:latest
            ghcr.io/${{ github.repository_owner }}/moonpilot-admin-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max